id = "rocket-monsters.herdr-layout"
name = "Herdr Layout"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Lays out new worktree workspaces from the project's .herdr-layout"
platforms = ["linux", "macos", "windows"]

[[events]]
on = "worktree.created"
command = ["sh", "layout.sh"]
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "layout.ps1"]
platforms = ["windows"]
